name: Validar portal documental
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  render-diagrams:
    runs-on: ubuntu-latest
    env:
      # Versión fija (no usar "latest") para que la regeneración sea reproducible.
      PLANTUML_VERSION: '1.2026.8'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar dependencias (website)
        working-directory: website
        run: npm ci
      - name: Verificar que los diagramas están al día
        # Compara el hash de cada .puml con manifest.json (no depende de las fuentes
        # instaladas en el runner, por eso no compara los bytes de los SVG).
        working-directory: website
        run: npm run diagrams:check
      - name: Descargar PlantUML (versión fija)
        run: |
          mkdir -p /tmp/plantuml
          curl -fsSL -o /tmp/plantuml/plantuml.jar \
            "https://github.com/plantuml/plantuml/releases/download/v${PLANTUML_VERSION}/plantuml.jar"
      - name: Validar que las fuentes .puml compilan
        working-directory: website
        run: PLANTUML_JAR=/tmp/plantuml/plantuml.jar npm run diagrams